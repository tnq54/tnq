<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; background: #121212; color: #e0e0e0; font-family: -apple-system, sans-serif; }
        .photopea-container {
            width: 100%;
            height: 85vh;
            min-height: 600px;
            background: #121212;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }
        .fallback-bar {
            background: #252525;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .fallback-btn {
            background: #0078d4;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .fallback-btn:hover {
            background: #106ebe;
        }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #121212;
        }
    </style>
</head>
<body>
    <div class="photopea-container">
        <div class="fallback-bar">
            <span>🎨 <strong>Photoshop CC Suite (Photopea)</strong></span>
            <a href="https://www.photopea.com" target="_blank" rel="noopener noreferrer" class="fallback-btn">
                🚀 Mở Photopea Cửa Sổ Mới (Phòng Lỗi Load Mobile)
            </a>
        </div>
        <iframe
            src="https://www.photopea.com"
            allow="camera; microphone; clipboard-read; clipboard-write; display-capture; autoplay"
            allowfullscreen="true">
        </iframe>
    </div>
</body>
</html>
